<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Ambient Player</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
</head>
<body class="view-vertical">
  <div id="player-container">
    <div id="frame-zone">
      <!-- Crosshairs -->
      <div id="crosshair-h" class="crosshair"></div>
      <div id="crosshair-v" class="crosshair"></div>
      
      <div id="album-art-frame">
        <img id="album-art" src="" alt="" />
        <div id="lyrics-overlay" class="hidden"></div>
      </div>
    </div>
    
    <div id="player-info-controls">
      <div class="info-section">
        <h1 id="song-title">SONG TITLE</h1>
        <h2 id="artist-name">ARTIST NAME</h2>
      </div>

      <div class="progress-section">
        <span id="time-current">0:00</span>
        <input type="range" id="seek-bar" value="0" step="0.1" min="0" max="100">
        <span id="time-duration">0:00</span>
      </div>

      <div class="controls-section">
        <button id="btn-prev" class="control-btn" aria-label="Previous">◁◁</button>
        <button id="btn-play-pause" class="control-btn" aria-label="Play/Pause">▶</button>
        <button id="btn-next" class="control-btn" aria-label="Next">▷▷</button>
      </div>

      <div id="corner-controls">
        <button id="bookmarklet-btn" class="control-btn" aria-label="Bookmarklet" title="ブックマークレット">🔗</button>
        <button id="layout-btn" class="control-btn" aria-label="Toggle Layout" title="レイアウト変更">◫</button>
        <button id="bg-switcher" class="control-btn" aria-label="Change Background" title="背景を切り替え">◨</button>
      </div>
    </div>
  </div>

  <!-- Bookmarklet Modal -->
  <div id="bookmarklet-modal">
    <div id="bookmarklet-modal-inner">
      <h3>🔗 ブックマークレット</h3>
      <p>Sunoのプレイリストページで実行するブックマークレットです。
        以下をコピーしてブラウザのブックマークのURL欄に貼り付けてください。</p>
      <textarea id="bookmarklet-code" readonly></textarea>
      <div id="bookmarklet-modal-btns">
        <button id="bookmarklet-copy-btn">📋 コピー</button>
        <button id="bookmarklet-close-btn">閉じる</button>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>
  <script type="module" src="/main.js"></script>
</body>
</html>
